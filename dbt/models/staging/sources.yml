version: 2

sources:
  - name: raw                      # referred to as source('raw', ...)
    schema: raw                    # the PostgreSQL schema created in Phase 2
    description: "Prices and load logs exactly as received from Yahoo Finance"
    tables:
      - name: daily_prices
        description: "One row per stock per trading day (upserted by extract/load_prices.py)"
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 30, period: hour}    # a weekday run was probably missed
            error_after: {count: 96, period: hour}   # longer than a normal weekend
      - name: load_log
        description: "One row per stock per pipeline run"